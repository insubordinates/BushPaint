<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BushPaint 1.0</title>
    <!-- FontAwesome for retro tool icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: "Tahoma", "MS Sans Serif", "Segoe UI", sans-serif;
            font-size: 11px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevents touch scrolling while painting */
        }

        body {
            background-color: #008080; /* Classic WinXP Teal Desktop */
            margin: 0;
            padding: 8px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        /* Classic Windows Window Frame */
        .window {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: 3px 3px 12px rgba(0,0,0,0.6);
            width: 960px;
            max-width: 99vw;
            height: 680px;
            max-height: 98vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Title Bar */
        .title-bar {
            background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
            padding: 3px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .title-bar-text {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title-bar-controls button {
            width: 16px;
            height: 14px;
            background: #c0c0c0;
            border: 1px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            font-size: 9px;
            font-weight: bold;
            line-height: 10px;
            text-align: center;
            padding: 0;
            cursor: pointer;
        }

        /* Menu Bar */
        .menu-bar {
            display: flex;
            background: #c0c0c0;
            padding: 2px 4px;
            border-bottom: 1px solid #808080;
            gap: 12px;
        }

        .menu-item {
            padding: 2px 6px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #000080;
            color: white;
        }

        /* Workspace Area */
        .workspace {
            display: flex;
            flex: 1;
            padding: 4px;
            gap: 4px;
            overflow: hidden;
            background: #c0c0c0;
        }

        /* Left Sidebar Toolbar */
        .toolbar {
            width: 155px;
            background: #c0c0c0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 2px;
            flex-shrink: 0;
        }

        .tool-box {
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 3px;
            background: #d4d0c8;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }

        /* Retro Beveled Buttons */
        .btn-retro {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 4px 2px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-retro:active, .btn-retro.active {
            border-color: #808080 #ffffff #ffffff #808080;
            background: #e0e0e0;
            font-weight: bold;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.4);
        }

        /* Bush Presidential Frame */
        .bush-portrait-frame {
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            background: #000;
            padding: 2px;
            text-align: center;
        }

        .bush-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
            border: 1px solid #808080;
        }

        .bush-caption {
            background: #000080;
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            padding: 2px 0;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Canvas Scroll Container */
        .canvas-area {
            flex: 1;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            background: #808080;
            overflow: auto;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 8px;
            position: relative;
        }

        canvas {
            background: #ffffff;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.5);
            cursor: crosshair;
            display: block;
        }

        /* Bottom Palette Bar */
        .bottom-bar {
            background: #c0c0c0;
            padding: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #ffffff;
        }

        .color-palette {
            display: grid;
            grid-template-rows: 1fr 1fr;
            grid-auto-flow: column;
            gap: 1px;
            background: #808080;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 1px;
        }

        .color-swatch {
            width: 15px;
            height: 15px;
            cursor: pointer;
            border: 1px solid #000;
        }

        .current-color-box {
            width: 32px;
            height: 32px;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            position: relative;
            background: #c0c0c0;
        }

        .active-color-indicator {
            width: 20px;
            height: 20px;
            position: absolute;
            top: 6px;
            left: 6px;
            border: 1px solid #000;
            background: #000000;
        }

        /* POWER Switch Control */
        .power-panel {
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            background: #b0b0b0;
            padding: 3px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .power-label {
            font-weight: bold;
            color: #b91c1c;
            font-size: 11px;
            text-shadow: 1px 1px 0px #fff;
        }

        .power-switch-btn {
            background: #d4d0c8;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            font-weight: bold;
            padding: 3px 10px;
            cursor: pointer;
            color: #000;
        }

        .power-switch-btn.on {
            background: #ff0000;
            color: #ffffff;
            border-color: #808080 #ffffff #ffffff #808080;
            box-shadow: 0 0 10px #ff0000;
        }

        /* Status Bar Footer */
        .status-bar {
            background: #c0c0c0;
            border-top: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 2px 6px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #000;
        }

        .status-field {
            border: 1px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 1px 6px;
            background: #c0c0c0;
        }

        /* POWER MODE GLOW AND ANIMATIONS */
        body.power-mode-active {
            background: #000022;
        }

        .power-mode-active .window {
            border-color: #ff0000 #00ffff #00ffff #ff0000;
            animation: windowGlow 0.8s infinite alternate;
        }

        @keyframes windowGlow {
            0% { box-shadow: 0 0 20px #ff0000, 0 0 40px #0000ff; }
            100% { box-shadow: 0 0 40px #00ffff, 0 0 70px #ff00ff, 0 0 90px #ffff00; }
        }

        .power-mode-active .title-bar {
            background: linear-gradient(90deg, #ff0000 0%, #0000ff 50%, #ff0000 100%);
            background-size: 200% 200%;
            animation: flagShift 1s linear infinite;
        }

        @keyframes flagShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Animated Waving Flag Background inside Canvas Container */
        .power-mode-active .canvas-area {
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), 
                        url('https://upload.wikimedia.org/wikipedia/commons/a/a4/Flag_of_the_United_States.svg');
            background-size: cover;
            background-position: center;
            animation: flagWave 2s infinite ease-in-out alternate;
        }

        @keyframes flagWave {
            0% { filter: brightness(1) drop-shadow(0 0 8px #ff0000); transform: scale(1); }
            100% { filter: brightness(1.4) drop-shadow(0 0 25px #0000ff); transform: scale(1.01); }
        }

        .power-mode-active .bush-portrait-frame {
            border-color: #ffff00;
            box-shadow: 0 0 15px #ffff00;
            animation: framePulse 0.5s infinite alternate;
        }

        @keyframes framePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Power Mode Banner Overlay */
        .power-banner {
            display: none;
            background: #ff0000;
            color: #ffff00;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            padding: 2px 0;
            letter-spacing: 2px;
            border-bottom: 1px solid #000;
        }

        .power-mode-active .power-banner {
            display: block;
            animation: marqueeGlow 0.4s infinite alternate;
        }

        @keyframes marqueeGlow {
            0% { background: #ff0000; color: #ffff00; }
            100% { background: #0000ff; color: #ffffff; }
        }
    </style>
</head>
<body>

    <div class="window" id="appWindow">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="title-bar-text">
                <i class="fa-solid fa-paint-brush"></i>
                <span>BushPaint 1.0 - [Untitled]</span>
            </div>
            <div class="title-bar-controls">
                <button>_</button>
                <button>&#9633;</button>
                <button style="background: #e06060; color: white;">X</button>
            </div>
        </div>

        <!-- Power Banner Marquee -->
        <div class="power-banner">
            ★ ★ ★ GOD BLESS AMERICA - POWER MODE ACTIVATED ★ ★ ★
        </div>

        <!-- Menu Bar -->
        <div class="menu-bar">
            <span class="menu-item"><u>F</u>ile</span>
            <span class="menu-item"><u>E</u>dit</span>
            <span class="menu-item"><u>V</u>iew</span>
            <span class="menu-item"><u>I</u>mage</span>
            <span class="menu-item"><u>O</u>ptions</span>
            <span class="menu-item"><u>H</u>elp</span>
        </div>

        <!-- Main Workspace -->
        <div class="workspace">
            <!-- Left Toolbar -->
            <div class="toolbar">
                <!-- Verified Library of Congress Presidential Portrait -->
                <div class="bush-portrait-frame">
                    <img id="bushImage" 
                         src="https://tile.loc.gov/storage-services/service/pnp/ppbd/00300/00371v.jpg" 
                         alt="George W. Bush" 
                         class="bush-img"
                         onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/d/d4/George-W-Bush.jpg';">
                    <div class="bush-caption">G. W. BUSH - 43rd POTUS</div>
                </div>

                <!-- Painting Tools -->
                <div class="tool-box">
                    <div style="font-weight: bold; margin-bottom: 3px; text-align: center;">Tools</div>
                    <div class="tool-grid">
                        <button class="btn-retro active" id="toolPencil" title="Pencil (1px)"><i class="fa-solid fa-pencil"></i> Pencil</button>
                        <button class="btn-retro" id="toolBrush" title="Brush Tool"><i class="fa-solid fa-paint-brush"></i> Brush</button>
                        <button class="btn-retro" id="toolEraser" title="Eraser Tool"><i class="fa-solid fa-eraser"></i> Eraser</button>
                        <button class="btn-retro" id="toolBucket" title="Fill Bucket"><i class="fa-solid fa-fill-drip"></i> Fill</button>
                        <button class="btn-retro" id="toolLine" title="Line Tool"><i class="fa-solid fa-slash"></i> Line</button>
                        <button class="btn-retro" id="toolRect" title="Rectangle Tool"><i class="fa-regular fa-square"></i> Rect</button>
                    </div>
                </div>

                <!-- Size Controls -->
                <div class="tool-box">
                    <div style="font-weight: bold; margin-bottom: 3px; text-align: center;">Thickness</div>
                    <div style="display: flex; flex-direction: column; gap: 2px;">
                        <button class="btn-retro size-btn" data-size="1">Fine (1px)</button>
                        <button class="btn-retro active size-btn" data-size="4">Medium (4px)</button>
                        <button class="btn-retro size-btn" data-size="10">Thick (10px)</button>
                    </div>
                </div>

                <!-- Reset Canvas Button -->
                <button class="btn-retro" id="clearBtn" style="margin-top: auto; padding: 6px;"><i class="fa-solid fa-trash"></i> Clear Canvas</button>
            </div>

            <!-- Canvas Workspace Area -->
            <div class="canvas-area" id="canvasArea">
                <canvas id="paintCanvas" width="700" height="460"></canvas>
            </div>
        </div>

        <!-- Bottom Palette & Power Controls -->
        <div class="bottom-bar">
            <!-- Active Color Indicator -->
            <div class="current-color-box">
                <div class="active-color-indicator" id="activeColorBox"></div>
            </div>

            <!-- Color Palette Grid -->
            <div class="color-palette" id="colorPalette">
                <!-- Color swatches generated via Javascript -->
            </div>

            <!-- Color Picker -->
            <div style="display: flex; flex-direction: column; gap: 1px;">
                <label style="font-size: 8px; font-weight: bold;">Custom:</label>
                <input type="color" id="customColorPicker" value="#000000" style="width: 24px; height: 18px; padding: 0; border: 1px solid #000; cursor: pointer;">
            </div>

            <!-- POWER Switch Toggle -->
            <div class="power-panel" style="margin-left: auto;">
                <span class="power-label"><i class="fa-solid fa-bolt"></i> POWER:</span>
                <button class="power-switch-btn" id="powerBtn">OFF</button>
            </div>
        </div>

        <!-- Status Bar Footer -->
        <div class="status-bar">
            <div class="status-field" id="statusText">Ready</div>
            <div class="status-field" id="cursorPos">0, 0px</div>
            <div class="status-field" style="font-weight: bold; color: #000080;">Last updated: October 11th 2026</div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('paintCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const activeColorBox = document.getElementById('activeColorBox');
            const customColorPicker = document.getElementById('customColorPicker');
            const powerBtn = document.getElementById('powerBtn');
            const statusText = document.getElementById('statusText');
            const cursorPos = document.getElementById('cursorPos');

            // Explicit Canvas Background Setup
            function initCanvas() {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            initCanvas();

            // State variables
            let isDrawing = false;
            let currentTool = 'pencil'; // pencil, brush, eraser, bucket, line, rect
            let currentColor = '#000000';
            let currentSize = 4;
            let startX = 0;
            let startY = 0;
            let canvasSnapshot = null;

            // Palette Swatches
            const colors = [
                '#000000', '#808080', '#800000', '#808000', '#008000', '#008080', '#000080', '#800080',
                '#ffffff', '#c0c0c0', '#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff'
            ];

            const colorPaletteContainer = document.getElementById('colorPalette');
            colors.forEach(col => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = col;
                swatch.addEventListener('click', () => {
                    currentColor = col;
                    activeColorBox.style.backgroundColor = col;
                    customColorPicker.value = col;
                });
                colorPaletteContainer.appendChild(swatch);
            });

            customColorPicker.addEventListener('input', (e) => {
                currentColor = e.target.value;
                activeColorBox.style.backgroundColor = currentColor;
            });

            // Tool Switching
            const toolButtons = {
                pencil: document.getElementById('toolPencil'),
                brush: document.getElementById('toolBrush'),
                eraser: document.getElementById('toolEraser'),
                bucket: document.getElementById('toolBucket'),
                line: document.getElementById('toolLine'),
                rect: document.getElementById('toolRect')
            };

            Object.keys(toolButtons).forEach(key => {
                toolButtons[key].addEventListener('click', () => {
                    Object.values(toolButtons).forEach(btn => btn.classList.remove('active'));
                    toolButtons[key].classList.add('active');
                    currentTool = key;
                    statusText.textContent = `Tool: ${key.toUpperCase()}`;
                });
            });

            // Size Switching
            const sizeBtns = document.querySelectorAll('.size-btn');
            sizeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSize = parseInt(btn.getAttribute('data-size'));
                });
            });

            // Clear Canvas Button
            document.getElementById('clearBtn').addEventListener('click', () => {
                initCanvas();
                statusText.textContent = 'Canvas Cleared';
            });

            // Accurate Canvas Coordinates taking element bounds into account
            function getCanvasCoords(e) {
                const rect = canvas.getBoundingClientRect();
                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: Math.round((clientX - rect.left) * (canvas.width / rect.width)),
                    y: Math.round((clientY - rect.top) * (canvas.height / rect.height))
                };
            }

            // Flood Fill Algorithm for Bucket Tool
            function floodFill(startX, startY, fillColorHex) {
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                // Convert hex to RGBA
                const tempDiv = document.createElement('div');
                tempDiv.style.color = fillColorHex;
                document.body.appendChild(tempDiv);
                const rgbStr = window.getComputedStyle(tempDiv).color;
                document.body.removeChild(tempDiv);
                const rgb = rgbStr.match(/\d+/g).map(Number);
                const fillR = rgb[0], fillG = rgb[1], fillB = rgb[2];

                const targetPos = (startY * canvas.width + startX) * 4;
                const targetR = data[targetPos];
                const targetG = data[targetPos + 1];
                const targetB = data[targetPos + 2];

                if (targetR === fillR && targetG === fillG && targetB === fillB) return;

                const pixelStack = [[startX, startY]];

                while (pixelStack.length > 0) {
                    const [x, y] = pixelStack.pop();
                    let currentPos = (y * canvas.width + x) * 4;

                    let reachLeft = false;
                    let reachRight = false;

                    let curY = y;
                    while (curY >= 0 && matchColor(curY * canvas.width + x)) {
                        curY--;
                    }
                    curY++;

                    while (curY < canvas.height && matchColor(curY * canvas.width + x)) {
                        currentPos = (curY * canvas.width + x) * 4;
                        data[currentPos] = fillR;
                        data[currentPos + 1] = fillG;
                        data[currentPos + 2] = fillB;
                        data[currentPos + 3] = 255;

                        if (x > 0) {
                            if (matchColor(curY * canvas.width + (x - 1))) {
                                if (!reachLeft) {
                                    pixelStack.push([x - 1, curY]);
                                    reachLeft = true;
                                }
                            } else if (reachLeft) {
                                reachLeft = false;
                            }
                        }

                        if (x < canvas.width - 1) {
                            if (matchColor(curY * canvas.width + (x + 1))) {
                                if (!reachRight) {
                                    pixelStack.push([x + 1, curY]);
                                    reachRight = true;
                                }
                            } else if (reachRight) {
                                reachRight = false;
                            }
                        }

                        curY++;
                    }
                }

                function matchColor(posIdx) {
                    const idx = posIdx * 4;
                    return data[idx] === targetR && data[idx + 1] === targetG && data[idx + 2] === targetB;
                }

                ctx.putImageData(imgData, 0, 0);
            }

            // Universal Drawing Event Handlers
            function startDrawing(e) {
                isDrawing = true;
                const coords = getCanvasCoords(e);
                startX = coords.x;
                startY = coords.y;

                if (currentTool === 'bucket') {
                    floodFill(startX, startY, currentColor);
                    isDrawing = false;
                    return;
                }

                ctx.beginPath();
                ctx.moveTo(startX, startY);

                if (currentTool === 'pencil') {
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = 1;
                    ctx.lineCap = 'butt';
                    ctx.lineTo(startX, startY);
                    ctx.stroke();
                } else if (currentTool === 'brush') {
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = currentSize;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineTo(startX, startY);
                    ctx.stroke();
                } else if (currentTool === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = currentSize * 3;
                    ctx.lineCap = 'square';
                    ctx.lineTo(startX, startY);
                    ctx.stroke();
                } else if (currentTool === 'line' || currentTool === 'rect') {
                    canvasSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
                }
            }

            function draw(e) {
                const coords = getCanvasCoords(e);
                cursorPos.textContent = `${coords.x}, ${coords.y}px`;

                if (!isDrawing) return;

                if (currentTool === 'pencil') {
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = 1;
                    ctx.lineCap = 'butt';
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                } else if (currentTool === 'brush') {
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = currentSize;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                } else if (currentTool === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = currentSize * 3;
                    ctx.lineCap = 'square';
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                } else if (currentTool === 'line') {
                    ctx.putImageData(canvasSnapshot, 0, 0);
                    ctx.beginPath();
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = currentSize;
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                } else if (currentTool === 'rect') {
                    ctx.putImageData(canvasSnapshot, 0, 0);
                    ctx.beginPath();
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = currentSize;
                    const w = coords.x - startX;
                    const h = coords.y - startY;
                    ctx.strokeRect(startX, startY, w, h);
                }
            }

            function stopDrawing() {
                if (isDrawing) {
                    isDrawing = false;
                    ctx.closePath();
                }
            }

            // Mouse Event Listeners
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', stopDrawing);

            // Touch Event Listeners for Mobile / Touchscreens
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startDrawing(e);
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                draw(e);
            }, { passive: false });

            window.addEventListener('touchend', stopDrawing);

            // POWER Switch Logic
            let powerMode = false;
            powerBtn.addEventListener('click', () => {
                powerMode = !powerMode;
                if (powerMode) {
                    powerBtn.classList.add('on');
                    powerBtn.textContent = 'ON';
                    document.body.classList.add('power-mode-active');
                    statusText.textContent = '*** EXECUTIVE POWER MODE ACTIVATED ***';
                } else {
                    powerBtn.classList.remove('on');
                    powerBtn.textContent = 'OFF';
                    document.body.classList.remove('power-mode-active');

            });
